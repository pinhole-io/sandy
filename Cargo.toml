[package]
name = "sandy"
version = "0.2.0"
edition = "2021"
license = "BSD-4-Clause"
default-run = "sandy"

[lib]
name = "sandy"
crate-type = ["rlib"]

[features]
default = ["python-bindings", "firecracker"]
python-bindings = ["dep:pyo3"]
docker = ["dep:bollard", "dep:futures-util", "dep:uuid", "dep:tar"]
exec-sandbox = []
firecracker = ["dep:libc"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3.27"
tokio = { version = "1", features = ["full"] }
bollard = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
tar = { version = "0.4", optional = true }
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
regex = "1.13"
wait-timeout = "0.2"
toml = "0.8"
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }
libc = { version = "0.2", optional = true }

[[test]]
name = "docker_integration"
path = "tests/docker_integration.rs"
required-features = ["docker"]

[[test]]
name = "firecracker_integration"
path = "tests/firecracker_integration.rs"
required-features = ["firecracker"]
